name: Scheduled jobs

# Calls the protected internal endpoints. Set repository secrets SITE_URL and CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * *" # Google Sheets retry
    - cron: "30 19 * * *" # maintenance, 02:30 WIB
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Sheets sync retry
        if: github.event.schedule != '30 19 * * *'
        run: curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/sheets-sync"
      - name: Maintenance
        if: github.event.schedule == '30 19 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/maintenance"
